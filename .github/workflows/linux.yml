name: linux
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux_buil_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: afaad562a14af40939c3ac2035a0f3f2a4a528cc
        persist-credentials: false
    - name: build
      run: 'mkdir build && cd build

        cmake .. -DMNN_BUILD_TEST=ON -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DMNN_LOW_MEMORY=true
        -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DLLM_SUPPORT_AUDIO=true
        -DMNN_BUILD_AUDIO=true -DMNN_OPENCL=ON -DMNN_VULKAN=ON

        make -j4

        '
    - name: test
      run: cd build && ./run_test.out
    - name: build_non_sse
      run: 'mkdir build_non_sse && cd build_non_sse

        cmake -DMNN_BUILD_TEST=ON -DMNN_USE_SSE=OFF ..

        make -j4

        '
    - name: test_non_sse
      run: cd build_non_sse && ./run_test.out
    - name: build_avx512
      run: 'mkdir build_avx512 && cd build_avx512

        cmake -DMNN_BUILD_TEST=ON -DMNN_AVX512=ON -DMNN_AVX512_VNNI=ON ..

        make -j4

        '
'on':
  workflow_dispatch: {}
run-name: linux / master afaad562 / dry run
