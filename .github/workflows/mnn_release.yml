name: mnn_release
jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: get-version
      id: get_version
      run: 'echo "VERSION=dev-ce2f41ec" >> "$GITHUB_OUTPUT"

        '
  linux-release:
    needs:
    - setup
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_linux_x64_cpu_opencl_vulkan
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: build
      run: '# j24 -> j4 avoid ld signal 9

        sed -i "s/-j24/-j4/g" package_scripts/linux/build_lib.sh

        # LLM (+ vision/audio) is already enabled in build_lib.sh by default.

        ./package_scripts/linux/build_lib.sh -o ${{ env.PACKAGENAME }}/lib -b opencl,vulkan -s -c

        '
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  windows-release:
    needs:
    - setup
    runs-on: windows-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_windows_x64_cpu_opencl_vulkan_avx512
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: using msvc
      uses: ilammy/msvc-dev-cmd@v1
    - name: build
      run: powershell .\package_scripts\win\build_lib_release.ps1 -path ${{ env.PACKAGENAME }}
    - name: package
      run: 7z a -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  macos-release:
    needs:
    - setup
    runs-on: macos-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_macos_x64_arm82_cpu_opencl_metal
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: build
      run: "./package_scripts/mac/buildFrameWork.sh \\\n  -DMNN_BUILD_LLM=ON \\\n  -DMNN_BUILD_LLM_OMNI=ON\n"
    - name: package
      run: 'rm -rf ${{ env.PACKAGENAME }}

        mv MNN-MacOS-CPU-GPU ${{ env.PACKAGENAME }}

        rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  android-release:
    needs:
    - setup
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_android_armv7_armv8_cpu_opencl_vulkan
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: setup-ndk
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27c
        add-to-path: false
    - name: build
      env:
        ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "sed -i 's|^CMAKEARGS=\"\\(.*\\)\"$|CMAKEARGS=\"\\1 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON\"|' \\\n  package_scripts/android/build.sh\n\
        sed -i 's|android-14|android-21|g' package_scripts/android/build.sh\n./package_scripts/android/build.sh -o ${{ env.PACKAGENAME\
        \ }}\n"
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  harmony-release:
    needs:
    - setup
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_harmony_arm64_cpu
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: Setup OpenHarmony SDK
      id: setup-ohos
      uses: openharmony-rs/setup-ohos-sdk@v1.0.0
      with:
        version: 5.0.0
    - name: build
      env:
        OHOS_SDK_NATIVE: ${{ steps.setup-ohos.outputs.ohos_sdk_native }}
      run: ./package_scripts/harmony/build.sh -o ${{ env.PACKAGENAME }}
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  ios-release:
    needs:
    - setup
    runs-on: macos-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_ios_armv82_cpu_metal
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: build
      run: "brew install coreutils\n./package_scripts/ios/buildiOS.sh \\\n  -DMNN_BUILD_LLM=ON \\\n  -DMNN_BUILD_LLM_OMNI=ON\n"
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip MNN-iOS-CPU-GPU/Static/MNN.framework

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  upload-release:
    name: Validate release artifacts (no publication)
    needs:
    - linux-release
    - windows-release
    - macos-release
    - android-release
    - ios-release
    - harmony-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: artifact-*
        path: dist
        merge-multiple: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate all platform ZIPs and prepare upload manifest
      shell: bash
      run: "python - <<'PY'\nimport hashlib, json, pathlib, zipfile\nfiles = sorted(pathlib.Path('dist').glob('*.zip'))\n\
        assert len(files) == 6, f'Expected six platform archives, found {len(files)}'\nmanifest = []\nfor path in files:\n\
        \    with zipfile.ZipFile(path) as archive:\n        assert archive.namelist(), f'Empty archive: {path}'\n       \
        \ bad = archive.testzip()\n        assert bad is None, f'Corrupt ZIP entry: {path}: {bad}'\n    manifest.append({'file':\
        \ path.name, 'bytes': path.stat().st_size,\n                     'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()})\n\
        pathlib.Path('release-manifest.json').write_text(json.dumps(manifest, indent=2))\nprint(json.dumps(manifest, indent=2))\n\
        PY\n"
    - uses: actions/upload-artifact@v4
      with:
        name: release-dry-run-manifest
        path: release-manifest.json
        if-no-files-found: error
'on':
  push:
    branches:
    - feature/ci-release-dry-run-20261028-ce2f41ec
  workflow_dispatch: {}
permissions:
  contents: read
run-name: mnn_release / master ce2f41ec / dry run
