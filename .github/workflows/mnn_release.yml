name: mnn_release
jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: get-version
      id: get_version
      run: 'echo "VERSION=fix-07cb266e" >> "$GITHUB_OUTPUT"

        '
  linux-release:
    needs:
    - setup
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_linux_x64_cpu_opencl_vulkan
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: 07cb266e87d25eb60ea6174fda747346db9e8f08
        persist-credentials: false
    - name: build
      run: '# j24 -> j4 avoid ld signal 9

        sed -i "s/-j24/-j4/g" package_scripts/linux/build_lib.sh

        # LLM (+ vision/audio) is already enabled in build_lib.sh by default.

        ./package_scripts/linux/build_lib.sh -o ${{ env.PACKAGENAME }}/lib -b opencl,vulkan -s -c

        '
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  harmony-release:
    needs:
    - setup
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: mnn_${{ needs.setup.outputs.VERSION }}_harmony_arm64_cpu
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: 07cb266e87d25eb60ea6174fda747346db9e8f08
        persist-credentials: false
    - name: Setup OpenHarmony SDK
      id: setup-ohos
      uses: openharmony-rs/setup-ohos-sdk@v1.0.0
      with:
        version: 5.0.0
    - name: build
      env:
        OHOS_SDK_NATIVE: ${{ steps.setup-ohos.outputs.ohos_sdk_native }}
      run: ./package_scripts/harmony/build.sh -o ${{ env.PACKAGENAME }}
    - name: package
      run: 'rm -f ${{ env.PACKAGENAME }}.zip

        zip -9 -y -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

        '
    - name: upload-zip
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip
        if-no-files-found: error
  validate-artifacts:
    name: Validate Linux and Harmony packages (no publication)
    needs:
    - linux-release
    - harmony-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: artifact-*
        path: dist
        merge-multiple: true
    - name: Check package integrity
      run: "python3 - <<'PY'\nimport hashlib,json,pathlib,zipfile\nfiles=sorted(pathlib.Path('dist').glob('*.zip'))\nassert\
        \ len(files)==2, f'Expected Linux and Harmony packages, got {len(files)}'\nassert sum('_linux_' in p.name for p in\
        \ files)==1\nassert sum('_harmony_' in p.name for p in files)==1\nmanifest=[]\nfor path in files:\n    with zipfile.ZipFile(path)\
        \ as archive:\n        assert archive.namelist(), f'Empty archive: {path}'\n        assert archive.testzip() is None,\
        \ f'Corrupt archive: {path}'\n    manifest.append({'file':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})\n\
        pathlib.Path('release-manifest.json').write_text(json.dumps(manifest,indent=2))\nprint(json.dumps(manifest,indent=2))\n\
        PY\n"
    - uses: actions/upload-artifact@v4
      with:
        name: release-build-fix-manifest
        path: release-manifest.json
        if-no-files-found: error
run-name: Linux + Harmony release build fixes / 07cb266e
'on':
  push:
    branches:
    - feature/fix-release-build-linux-harmony
  workflow_dispatch: {}
permissions:
  contents: read
