name: pymnn-linux
concurrency:
  group: pymnn-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pymnn_linux_buil_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: afaad562a14af40939c3ac2035a0f3f2a4a528cc
        persist-credentials: false
    - name: prepare
      run: 'sudo pip3 install "numpy<2.5" "opencv-python<5" torch

        '
    - name: build
      run: 'cd pymnn/pip_package

        python3 build_deps.py llm

        sudo python3 setup.py install --version 1.0

        '
    - name: test
      run: 'cd pymnn/test

        python3 unit_test.py

        '
'on':
  push:
    branches:
    - feature/ci-release-dry-run-20261028-afaad562
  workflow_dispatch: {}
run-name: pymnn-linux / master afaad562 / dry run
