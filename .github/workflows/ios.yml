name: ios
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios_build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ref: afaad562a14af40939c3ac2035a0f3f2a4a528cc
        persist-credentials: false
    - name: build-framework
      run: 'brew install coreutils

        ./package_scripts/ios/xcodebuildiOS.sh -o ios_build

        '
      shell: bash
    - name: show-framework
      run: 'ls -lh ios_build

        '
'on':
  workflow_dispatch: {}
run-name: ios / master afaad562 / dry run
