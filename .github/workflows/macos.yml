name: macos
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos_buil_test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ce2f41ec8cd3cfbb95ccdbe4225631ccf00bbea6
        persist-credentials: false
    - name: build
      run: 'mkdir build && cd build

        cmake .. -DMNN_BUILD_TEST=ON -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DMNN_LOW_MEMORY=true
        -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DLLM_SUPPORT_AUDIO=true
        -DMNN_BUILD_AUDIO=true -DMNN_OPENCL=ON -DMNN_VULKAN=ON

        make -j4

        '
    - name: test
      run: cd build && ./run_test.out
'on':
  push:
    branches:
    - feature/ci-release-dry-run-20261028-ce2f41ec
  workflow_dispatch: {}
run-name: macos / master ce2f41ec / dry run
